[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubicle-communicator"
version = "0.5.36"
description = "Cubicle — Claude Communicator CLI"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0,<15.0",
    "pyyaml>=6.0,<7.0",
    "click>=8.1,<9.0",
    "claude-agent-sdk>=0.1.0,<1.0.0",
    "aiohttp>=3.9,<4.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "redis>=5.0,<6.0",
    # Docker SDK for Python — drives the office container lifecycle.
    "docker>=7.0,<8.0",
    # In-process Redis implementation. The daemon's task queues,
    # session map, health telemetry, and message streams all run
    # against an in-process FakeRedis instance instead of an
    # external server. NO host ports, NO containers, NO subprocess —
    # all state lives in the daemon process's RAM. The 'lua' extra
    # enables Lua-script support for Redis ops the daemon uses
    # (zpopmin transactions, etc.). On daemon restart, state is
    # rebuilt via the backend resync + the JSON session-file
    # fallback. Operators wanting persistent Redis can set
    # ``redis_url=redis://...`` in config.yaml — see
    # ``src/local_redis.py``.
    "fakeredis[lua]>=2.21,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0",
    # Makes the ``timeout`` ini option below effective everywhere (it was
    # silently ignored where the plugin was absent); live-eval items get a
    # longer per-item timeout from tests/evals/_live_report_plugin.py.
    "pytest-timeout>=2.2,<3",
    "jsonschema>=4.0,<5.0",
]

[project.scripts]
cbcl = "src.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

# Ship non-.py assets that live INSIDE a package directory — pre this
# config the Dockerfile.agent / build.sh sitting beside .py modules
# in ``src/_agent_image/`` were silently dropped from the built wheel.
# Required so ``cbcl setup`` can find Dockerfile.agent at runtime in
# a pip / pipx install.
[tool.setuptools.package-data]
"src._agent_image" = ["Dockerfile.agent", "build.sh", "*.py"]
"src._agent_image._mcp" = ["*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
markers = [
    "integration: requires real Redis (localhost:6379)",
    "e2e: requires full stack (backend + Redis + communicator + Docker)",
    "benchmark: performance benchmarks (resource-intensive)",
    "live_eval: opt-in behavioral evals (real model calls). Deselected by default; select with `-m live_eval`. Without prerequisites each case is reported NOT EVALUATED (see tests/evals/README.md).",
    "runtime_eval: live_eval cases that run the Claude CLI inside the cbcl agent image (docker + credential + CUBICLE_EVAL_RUNTIME=1 required).",
    "eval_case(id, version, lane, role, critical, fixtures, declared): stable identity and version of a behavioral eval case, used by the live-eval report and compare; declared states the allowed tools, initial state and forbidden effects.",
]
# P6.10: e2e tests under tests/e2e/test_full_flow.py and
# tests/e2e/test_multi_agent.py are designed as standalone scripts
# (`python tests/e2e/test_full_flow.py`), not pytest-collected
# fixtures-based tests. They use top-level `async def test_*(office,
# redis)` signatures where `office`/`redis` are HELPERS, not pytest
# fixtures — pytest's auto-collection finds them and errors with
# "fixture not found". Exclude both from default `pytest` runs;
# they remain runnable as scripts and via explicit -m e2e selection.
addopts = "--ignore=tests/e2e/test_full_flow.py --ignore=tests/e2e/test_multi_agent.py -m 'not live_eval'"
